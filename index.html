<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulang meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #33384A;
    --frame: #E8E2D6;
    --text: #F3EFE6;
    --muted: #C5CCD8;
    --accent: #F0A35E;
    --accent-text: #2A1B0C;
    --ground: #5C7F9E;
    --sun: #FFF1B8;
    --sans: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--wall);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }
  .brand {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* Jendela kantor: matahari turun mengikuti jam kerja */
  .window {
    border: 8px solid var(--frame);
    border-radius: 20px;
    overflow: hidden;
    aspect-ratio: 400 / 260;
    background: #7FB7E6;
  }
  .sky { width: 100%; height: 100%; }
  .sky svg { display: block; width: 100%; height: 100%; }
  #sun { transition: transform 1.2s ease; }
  .ground { fill: var(--ground); transition: fill 1.2s ease; }
  .star { fill: #FFF6DA; opacity: 0; transition: opacity 1.5s ease; }
  .win { fill: #FFD98A; opacity: 0; transition: opacity 1.5s ease; }
  body.night .star { opacity: 0.85; }
  body.dusk .win { opacity: 0.9; }

  .count {
    font-size: clamp(2.5rem, 11vw, 4.2rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 28px 0 6px;
  }
  .until {
    color: var(--muted);
    margin: 0 0 20px;
  }
  .line {
    font-size: 1.2rem;
    max-width: 34ch;
    min-height: 3.2em;
    margin: 0 0 16px;
  }

  button {
    font: inherit;
    font-weight: 600;
    padding: 0.6rem 1.1rem;
    border-radius: 999px;
    border: 1.5px solid var(--frame);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:active { opacity: 0.75; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .notif {
    color: var(--muted);
    font-size: 0.92rem;
    max-width: 44ch;
    margin: 32px 0 12px;
    min-height: 1.4em;
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translate(-50%, -160%);
    width: min(92vw, 420px);
    background: var(--frame);
    color: #22273A;
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    transition: transform 0.3s ease;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast strong { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="brand">Pulang meter</h1>

  <div class="window">
    <div class="sky" id="sky">
      <svg viewBox="0 0 400 260" role="img" aria-label="Pemandangan dari jendela kantor: matahari bergerak turun mengikuti jam kerja">
        <defs>
          <radialGradient id="glow">
            <stop offset="0" style="stop-color:var(--sun);stop-opacity:0.85"></stop>
            <stop offset="1" style="stop-color:var(--sun);stop-opacity:0"></stop>
          </radialGradient>
        </defs>

        <circle class="star" cx="40" cy="40" r="1.3"></circle>
        <circle class="star" cx="90" cy="72" r="1.1"></circle>
        <circle class="star" cx="150" cy="30" r="1.4"></circle>
        <circle class="star" cx="210" cy="56" r="1.1"></circle>
        <circle class="star" cx="270" cy="34" r="1.3"></circle>
        <circle class="star" cx="322" cy="82" r="1.1"></circle>
        <circle class="star" cx="362" cy="46" r="1.4"></circle>
        <circle class="star" cx="120" cy="100" r="1"></circle>
        <circle class="star" cx="305" cy="18" r="1.2"></circle>

        <g id="sun" style="transform: translate(50px, 215px);">
          <circle r="60" fill="url(#glow)"></circle>
          <circle r="22" style="fill:var(--sun)"></circle>
        </g>

        <path class="ground" d="M0 260 V215 H30 V195 H60 V215 H75 V185 H110 V215 H140 V200 H170 V215 H210 V190 H225 V175 H255 V190 H270 V215 H300 V198 H335 V215 H360 V205 H400 V260 Z"></path>

        <rect class="win" x="36" y="202" width="4" height="5"></rect>
        <rect class="win" x="46" y="202" width="4" height="5"></rect>
        <rect class="win" x="82" y="194" width="4" height="5"></rect>
        <rect class="win" x="94" y="194" width="4" height="5"></rect>
        <rect class="win" x="84" y="205" width="4" height="5"></rect>
        <rect class="win" x="96" y="205" width="4" height="5"></rect>
        <rect class="win" x="232" y="184" width="4" height="5"></rect>
        <rect class="win" x="244" y="184" width="4" height="5"></rect>
        <rect class="win" x="234" y="198" width="4" height="5"></rect>
        <rect class="win" x="246" y="198" width="4" height="5"></rect>
        <rect class="win" x="308" y="206" width="4" height="5"></rect>
        <rect class="win" x="320" y="206" width="4" height="5"></rect>
        <rect class="win" x="368" y="212" width="4" height="3"></rect>
      </svg>
    </div>
  </div>

  <p class="count" id="count">&nbsp;</p>
  <p class="until" id="until"></p>
  <p class="line" id="line"></p>
  <button type="button" id="cheer">Semangatin dong</button>

  <p class="notif" id="notif" role="status"></p>
  <button type="button" class="primary" id="enable" hidden>Kabari aku pas mau pulang</button>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-messaging.js"></script>

<script>
(function () {
  // ===== Isi sekali di sini: config web app Firebase-mu =====
  // Firebase Console > Project settings > General > Your apps, dan tab Cloud Messaging untuk VAPID key.
  // Config web bukan rahasia; yang menjaga data adalah rules Firestore.
  var CONFIG = {
    apiKey: 'ISI_DI_SINI',
    authDomain: 'ISI_DI_SINI',
    projectId: 'tshpush2',
    storageBucket: 'ISI_DI_SINI',
    messagingSenderId: 'ISI_DI_SINI',
    appId: 'ISI_DI_SINI',
    vapidKey: 'ISI_DI_SINI'
  };
  var COLLECTION = 'device_tokens';

  // Jam kerja [jam, menit] menurut jam di perangkat pengunjung
  var WORK = { start: [8, 0], end: [17, 0] };

  // ===== Pulang meter =====
  var PLACEHOLDER = 'ISI_DI_SINI';
  var START = WORK.start[0] * 60 + WORK.start[1];
  var END = WORK.end[0] * 60 + WORK.end[1];
  var HORIZON = 215;

  var SKY_TOP = [[0, '#BBD6EC'], [0.45, '#78B4E8'], [0.7, '#86B6E4'], [0.79, '#C6AFCB'], [0.88, '#F0A35E'], [1, '#5B4A86']];
  var SKY_BOTTOM = [[0, '#F6E9CF'], [0.45, '#DCEBF7'], [0.7, '#E9EEF3'], [0.79, '#F7DCCB'], [0.88, '#FAD39B'], [1, '#E9765B']];
  var GROUND = [[0, '#5C7F9E'], [0.45, '#47688A'], [0.8, '#3A3560'], [1, '#2C2650']];
  var SUN = [[0, '#FFF1B8'], [0.6, '#FFE08A'], [0.9, '#FFA85C'], [1, '#FF7A45']];

  var LINES = {
    pre: [
      'Belum mulai. Kopi dulu, dunia bisa menunggu.',
      'Masih pagi. Notifikasi belum boleh bunyi.',
      'Jam kerja belum mulai, tapi kasur sudah kangen.'
    ],
    w1: [
      'Baru mulai. Kopi kedua masih aman.',
      'Semangat pagi, meskipun tinggal sisa-sisanya.',
      'Inbox penuh itu normal. Jangan panik dulu.'
    ],
    w2: [
      'Sebentar lagi makan siang. Pikirkan menu, bukan rapat.',
      'Setengah jalan menuju makan siang. Tahan.',
      'Perut mulai berpendapat. Dengarkan.'
    ],
    w3: [
      'Lewat tengah hari. Ngantuk itu wajar, bukan dosa.',
      'Sore masih jauh, tapi sudah kelihatan dari sini.',
      'Kopi ketiga? Tidak ada yang menghitung.'
    ],
    w4: [
      'Tinggal sedikit lagi. Jangan buka email baru.',
      'Matahari sudah mulai turun. Kamu juga boleh mulai siap-siap.',
      'Rapat dadakan jam segini melanggar perasaan.'
    ],
    w5: [
      'Tas sudah dipeluk? Laptop siap ditutup.',
      'Tinggal hitungan menit. Jangan mulai tugas baru.',
      'Sudah mau pulang. Pura-pura sibuk beberapa menit lagi.'
    ],
    after: [
      'Pulang! Hati-hati di jalan.',
      'Sudah lewat jam pulang. Tutup laptopnya, sekarang.',
      'Kantor boleh menunggu sampai besok.'
    ],
    weekend: [
      'Tidak ada yang perlu ditunggu. Nikmati saja.',
      'Matahari boleh santai hari ini, kamu juga.'
    ]
  };

  var $ = function (id) { return document.getElementById(id); };
  var skyEl = $('sky');
  var sunEl = $('sun');
  var countEl = $('count');
  var untilEl = $('until');
  var lineEl = $('line');
  var cheerBtn = $('cheer');
  var notifEl = $('notif');
  var enableBtn = $('enable');
  var toastEl = $('toast');

  function hexToRgb(h) {
    return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
  }
  function mix(a, b, t) {
    var A = hexToRgb(a), B = hexToRgb(b);
    return '#' + A.map(function (v, i) {
      return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0');
    }).join('');
  }
  function ramp(stops, p) {
    for (var i = 1; i < stops.length; i++) {
      if (p <= stops[i][0]) {
        var p0 = stops[i - 1][0], p1 = stops[i][0];
        return mix(stops[i - 1][1], stops[i][1], (p - p0) / (p1 - p0));
      }
    }
    return stops[stops.length - 1][1];
  }

  function label(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return String(h).padStart(2, '0') + '.' + String(m).padStart(2, '0');
  }
  function fmt(min) {
    var t = Math.max(1, Math.round(min));
    var h = Math.floor(t / 60), r = t % 60;
    if (!h) return r + ' menit';
    if (!r) return h + ' jam';
    return h + ' jam ' + r + ' menit';
  }

  var phase = null;
  var lineIdx = -1;

  function pickLine() {
    var arr = LINES[phase];
    var i;
    do { i = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && i === lineIdx);
    lineIdx = i;
    lineEl.textContent = arr[i];
  }

  function render() {
    var now = new Date();
    var day = now.getDay();
    var m = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    var mode, p;

    if (day === 0 || day === 6) { mode = 'weekend'; p = 0.4; }
    else if (m < START) { mode = 'pre'; p = 0; }
    else if (m >= END) { mode = 'after'; p = 1; }
    else { mode = 'work'; p = (m - START) / (END - START); }

    var newPhase;
    if (mode !== 'work') newPhase = mode;
    else if (p < 0.25) newPhase = 'w1';
    else if (p < 0.5) newPhase = 'w2';
    else if (p < 0.75) newPhase = 'w3';
    else if (p < 0.95) newPhase = 'w4';
    else newPhase = 'w5';

    if (newPhase !== phase) { phase = newPhase; pickLine(); }

    if (mode === 'work') {
      countEl.textContent = fmt(Math.ceil(END - m));
      untilEl.textContent = 'lagi sampai jam pulang, ' + label(END) + '. Hari kerja sudah ' + Math.floor(p * 100) + '% lewat.';
    } else if (mode === 'pre') {
      countEl.textContent = 'Belum mulai';
      untilEl.textContent = 'Jam kerja mulai ' + label(START) + ', sekitar ' + fmt(START - m) + ' lagi.';
    } else if (mode === 'after') {
      var over = Math.floor(m - END);
      countEl.textContent = 'Waktunya pulang';
      untilEl.textContent = over < 1
        ? 'Jam kerja baru saja selesai.'
        : 'Sudah lewat ' + fmt(over) + ' dari jam ' + label(END) + '.';
    } else {
      countEl.textContent = 'Hari ini libur';
      untilEl.textContent = 'Tidak ada jam pulang yang perlu ditunggu.';
    }

    // Langit, tanah, dan matahari
    var night = mode === 'after';
    var top = night ? '#1B2148' : ramp(SKY_TOP, p);
    var bottom = night ? '#3B3563' : ramp(SKY_BOTTOM, p);
    skyEl.style.background = 'linear-gradient(to bottom, ' + top + ', ' + bottom + ')';

    var root = document.documentElement.style;
    root.setProperty('--ground', night ? '#141A33' : ramp(GROUND, p));
    root.setProperty('--sun', ramp(SUN, p));

    var sx, sy;
    if (night) { sx = 350; sy = HORIZON + 45; }
    else { sx = 50 + 300 * p; sy = HORIZON - 140 * Math.sin(Math.PI * p); }
    sunEl.style.transform = 'translate(' + sx.toFixed(1) + 'px, ' + sy.toFixed(1) + 'px)';

    document.body.classList.toggle('night', night);
    document.body.classList.toggle('dusk', night || p >= 0.85);
  }

  cheerBtn.addEventListener('click', pickLine);
  render();
  setInterval(render, 30000);

  // ===== Token FCM: jalan otomatis di belakang layar =====
  var running = false;
  var listening = false;

  function setNotif(text) { notifEl.textContent = text; }

  function showToast(title, body) {
    toastEl.innerHTML = '';
    var strong = document.createElement('strong');
    strong.textContent = title;
    toastEl.appendChild(strong);
    if (body) {
      var span = document.createElement('span');
      span.textContent = body;
      toastEl.appendChild(span);
    }
    toastEl.classList.add('show');
    setTimeout(function () { toastEl.classList.remove('show'); }, 7000);
  }

  // Saat tab sedang dibuka, FCM tidak menampilkan notifikasi sendiri: tampilkan sebagai banner
  function listenForeground() {
    if (listening) return;
    listening = true;
    firebase.messaging().onMessage(function (payload) {
      var n = payload.notification || payload.data || {};
      showToast(n.title || 'Pesan baru', n.body || '');
    });
  }

  function configReady() {
    return ['apiKey', 'authDomain', 'projectId', 'messagingSenderId', 'appId', 'vapidKey'].every(function (k) {
      return CONFIG[k] && CONFIG[k] !== PLACEHOLDER;
    });
  }

  // Dokumen memakai token sebagai ID: buka halaman berkali-kali tetap 1 dokumen
  function saveTokenDoc(token) {
    return firebase.firestore().collection(COLLECTION).doc(token).set({
      token: token,
      last_seen: firebase.firestore.FieldValue.serverTimestamp(),
      user_agent: navigator.userAgent
    }, { merge: true });
  }

  async function setupPush() {
    if (running) return;
    if (!configReady()) {
      console.warn('CONFIG Firebase belum diisi, pengingat tidak diaktifkan.');
      return;
    }
    running = true;
    enableBtn.disabled = true;

    try {
      if (typeof firebase === 'undefined') {
        setNotif('Pengingat belum bisa dimuat. Hitung mundurnya tetap jalan.');
        return;
      }
      if (!('Notification' in window) || !('serviceWorker' in navigator) ||
          (firebase.messaging.isSupported && !firebase.messaging.isSupported())) {
        setNotif('Browser ini tidak mendukung notifikasi. Hitung mundurnya tetap jalan. Di iPhone, tambahkan halaman ini ke Home Screen dulu.');
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: CONFIG.apiKey,
          authDomain: CONFIG.authDomain,
          projectId: CONFIG.projectId,
          storageBucket: CONFIG.storageBucket === PLACEHOLDER ? '' : CONFIG.storageBucket,
          messagingSenderId: CONFIG.messagingSenderId,
          appId: CONFIG.appId
        });
      }

      var permission = Notification.permission;
      if (permission === 'default') {
        await Notification.requestPermission();
        permission = Notification.permission; // baca ulang: sebagian browser menahan popup tanpa klik
      }

      if (permission === 'denied') {
        enableBtn.hidden = true;
        setNotif('Notifikasi diblokir di browser ini, jadi tidak ada pengingat. Klik ikon gembok di address bar, ubah Notifications ke Allow, lalu muat ulang.');
        return;
      }
      if (permission !== 'granted') {
        enableBtn.hidden = false;
        setNotif('Izinkan notifikasi supaya kamu dikabari pas waktunya siap-siap pulang.');
        return;
      }
      enableBtn.hidden = true;

      var swParams = new URLSearchParams({
        apiKey: CONFIG.apiKey,
        authDomain: CONFIG.authDomain,
        projectId: CONFIG.projectId,
        storageBucket: CONFIG.storageBucket === PLACEHOLDER ? '' : CONFIG.storageBucket,
        messagingSenderId: CONFIG.messagingSenderId,
        appId: CONFIG.appId
      });
      var registration = await navigator.serviceWorker.register('firebase-messaging-sw.js?' + swParams.toString());
      await navigator.serviceWorker.ready;

      var token = await firebase.messaging().getToken({
        vapidKey: CONFIG.vapidKey,
        serviceWorkerRegistration: registration
      });
      if (!token) {
        setNotif('Pengingat belum bisa diaktifkan. Coba muat ulang halaman.');
        return;
      }

      await saveTokenDoc(token);
      listenForeground();
      setNotif('Pengingat aktif. Kamu akan dikabari lewat notifikasi.');
    } catch (err) {
      console.error(err);
      setNotif('Pengingat belum bisa diaktifkan. Coba muat ulang halaman.');
    } finally {
      running = false;
      enableBtn.disabled = false;
    }
  }

  // Tombol dipakai kalau browser menahan popup otomatis (Firefox dan Safari butuh klik)
  enableBtn.addEventListener('click', setupPush);
  setupPush();
})();
</script>
</body>
</html>
